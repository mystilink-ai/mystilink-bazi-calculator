[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mystilink-bazi-calculator"
version = "0.2.0"
description = "BaZi (Four Pillars) calculator with dayun and liunian JSON CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Mystilink" }]
keywords = ["bazi", "four-pillars", "calendar", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
mystilink-bazi = "mystilink_bazi.cli:main"

[tool.setuptools.packages.find]
include = ["mystilink_bazi*"]
